name: Název PR

# Název PR se při sloučení stane zprávou commitu, proto musí odpovídat Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            ci
            chore
            test
            build
            revert
          requireScope: false
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: 'Popis za typem začněte malým písmenem, např. "feat: zápis rozvrhu".'
