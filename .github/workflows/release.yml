name: Vydání

# release-please z conventional commitů na main připraví PR s novou verzí a CHANGELOGem.
# Po jeho sloučení vytvoří tag a GitHub Release; tento workflow k němu přibalí eob_pt32.zip pro HACS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Balíček
        run: cd custom_components/eob_pt32 && zip -r "$GITHUB_WORKSPACE/eob_pt32.zip" . -x "__pycache__/*"
      - name: Nahrání k vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" eob_pt32.zip --clobber
