name: Vydání

# release-please z conventional commitů na main připraví PR s novou verzí a CHANGELOGem.
# Po jeho sloučení vytvoří tag a GitHub Release; tento workflow k němu přibalí eob_pt32.zip pro HACS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Balíček
        run: cd custom_components/eob_pt32 && zip -r "$GITHUB_WORKSPACE/eob_pt32.zip" . -x "__pycache__/*"
      - name: Nahrání k vydání
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" eob_pt32.zip --clobber --repo "$GITHUB_REPOSITORY"
